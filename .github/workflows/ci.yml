name: Secure API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: secure_api
          POSTGRES_USER: secure_api
          POSTGRES_PASSWORD: secure_api_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secure_api -d secure_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/secure_api
          SPRING_DATASOURCE_USERNAME: secure_api
          SPRING_DATASOURCE_PASSWORD: secure_api_password
        run: mvn -B -ntp clean verify

  sast:
    name: SAST - SpotBugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile application
        run: mvn -B -ntp -DskipTests compile

      - name: Run SpotBugs
        run: >
          mvn -B -ntp
          com.github.spotbugs:spotbugs-maven-plugin:4.10.5.0:spotbugs

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugs*
          if-no-files-found: warn

  sca:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Scan dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B -ntp
          org.owasp:dependency-check-maven:13.0.0:check
          -Dformat=ALL
          -DfailBuildOnCVSS=7
          -DnvdApiKey="$NVD_API_KEY"

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.*
          if-no-files-found: warn
